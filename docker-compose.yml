version: '3.8'

networks:
  pterodactyl:
    driver: bridge

volumes:
  panel_data:
  panel_logs:
  db_data:
  wings_data:
  wings_config:

services:
  database:
    image: mariadb:10.11
    container_name: ptero_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: panel
      MYSQL_USER: pterodactyl
      MYSQL_PASSWORD: PteroSecretPass123!
      MYSQL_ROOT_PASSWORD: RootSecretPass123!
    networks:
      - pterodactyl

  cache:
    image: redis:alpine
    container_name: ptero_redis
    restart: always
    networks:
      - pterodactyl

  panel:
    image: ghcr.io/pterodactyl/panel:latest
    container_name: ptero_panel
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - panel_data:/app/var/
      - panel_logs:/app/storage/logs
    environment:
      APP_URL: "https://host.onlinevbs.dpdns.org"
      APP_ENV: "production"
      APP_ENVIRONMENT_ONLY: "false"
      APP_TIMEZONE: "UTC"
      DB_HOST: "database"
      DB_PORT: "3306"
      DB_DATABASE: "panel"
      DB_USERNAME: "pterodactyl"
      DB_PASSWORD: "PteroSecretPass123!"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_CONNECTION: "redis"
      REDIS_HOST: "cache"
      REDIS_PORT: "6379"
    depends_on:
      - database
      - cache
    networks:
      - pterodactyl

  wings:
    image: ghcr.io/pterodactyl/wings:latest
    container_name: ptero_wings
    restart: always
    ports:
      - "8080:8080"
      - "2022:2022"
    environment:
      TZ: "UTC"
      WINGS_UID: 988
      WINGS_GID: 988
      WINGS_USERNAME: "pterodactyl"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/pterodactyl/:/var/lib/pterodactyl/
      - /etc/pterodactyl/:/etc/pterodactyl/
      - /var/log/pterodactyl/:/var/log/pterodactyl/
    networks:
      - pterodactyl
